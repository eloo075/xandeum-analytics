<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White square background -->
  <rect width="24" height="24" fill="white"/>
  <!-- Outer circle -->
  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Three horizontal lines (parallels of latitude) -->
  <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Central straight vertical line (meridian) -->
  <line x1="12" y1="3" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Curved left meridian -->
  <path d="M7 3 Q4 6 4 12 Q4 18 7 21" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Curved right meridian -->
  <path d="M17 3 Q20 6 20 12 Q20 18 17 21" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>

