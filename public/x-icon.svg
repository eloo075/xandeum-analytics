<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White square background -->
  <rect width="24" height="24" fill="white"/>
  <!-- Solid diagonal from top-left to bottom-right -->
  <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Outlined diagonal from top-right to bottom-left (double line with gap) -->
  <!-- Top/left part of outline -->
  <line x1="18" y1="6" x2="12" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom/right part of outline -->
  <line x1="12" y1="12" x2="6" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Inner gap line (creates the outline effect by being slightly offset) -->
  <line x1="17.2" y1="6.8" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.1"/>
  <line x1="12" y1="12" x2="6.8" y2="17.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.1"/>
</svg>

